<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clínica · GAIA Playground</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0A0A0A; color: #F5F5F5;
    height: 100vh; display: grid;
    grid-template-columns: 1fr 380px;
  }
  .chat { display: flex; flex-direction: column; height: 100vh; }
  .chat-header {
    padding: 16px 24px; border-bottom: 1px solid #262626;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-header h1 { font-size: 16px; font-weight: 600; }
  .chat-header button {
    background: transparent; border: 1px solid #262626; color: #F5F5F5;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .chat-header button:hover { background: #1A1A1A; }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #00E5A0; color: #0A0A0A; }
  .msg.assistant { align-self: flex-start; background: #1A1A1A; }
  .msg.system { align-self: center; background: transparent; color: #8A8A8A; font-size: 11px; text-align: center; }
  .input-area { padding: 16px 24px; border-top: 1px solid #262626; display: flex; gap: 12px; }
  .input-area input {
    flex: 1; background: #141414; border: 1px solid #262626;
    color: #F5F5F5; padding: 12px 16px; border-radius: 8px; outline: none;
    font-size: 14px;
  }
  .input-area input:focus { border-color: #00E5A0; }
  .input-area button {
    background: #00E5A0; color: #0A0A0A; border: none;
    padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer;
  }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  .sidebar { background: #0F0F0F; border-left: 1px solid #262626; overflow-y: auto; padding: 20px; }
  .sidebar h3 { font-size: 11px; text-transform: uppercase; color: #8A8A8A; margin: 20px 0 8px; letter-spacing: 0.05em; }
  .sidebar h3:first-child { margin-top: 0; }
  .sidebar pre {
    background: #141414; border: 1px solid #262626; padding: 12px;
    border-radius: 6px; font-family: ui-monospace, monospace; font-size: 11px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    max-height: 200px; overflow-y: auto;
  }
</style>
</head>
<body>

<div class="chat">
  <div class="chat-header">
    <h1>🏥 Clínica San Juan · Asistente GAIA</h1>
    <button onclick="resetSession()">Nueva conversación</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input id="input" placeholder="Escribí tu mensaje..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Enviar</button>
  </div>
</div>

<div class="sidebar">
  <h3>Estado</h3>
  <pre id="debug-state">listo</pre>
  <h3>Historial</h3>
  <pre id="debug-history">[]</pre>
  <h3>Collected Data</h3>
  <pre id="debug-collected">null</pre>
  <h3>Última cita</h3>
  <pre id="debug-appointment">null</pre>
  <h3>Último Analyze</h3>
  <pre id="debug-analyze">—</pre>
  <h3>Último Synthesize</h3>
  <pre id="debug-synthesize">—</pre>
</div>

<script>

  "get_doctor_schedule":    { required: ["doctor", "date"] },

// ===================================================================
// OVERRIDE: detección por palabras clave en el mensaje del usuario.
// Si el mensaje matchea un patrón, se fuerza la función, sin importar
// lo que el Planner haya inventado.
// ===================================================================
const KEYWORD_OVERRIDES = [
  // Mi cita
  { patterns: ["mi cita", "mi turno", "mis citas", "mis turnos",
               "mi proxima cita", "mi próxima cita", "mi siguiente cita",
               "cuando es mi", "cuándo es mi", "cuando tengo", "cuándo tengo",
               "que dia es mi", "qué día es mi", "que dia tengo", "qué día tengo",
               "cuando me toca", "cuándo me toca"],
    function: "list_my_appointments" },

  // Precios
  { patterns: ["cuanto cuesta", "cuánto cuesta", "cuanto sale", "cuánto sale",
               "cuanto vale", "cuánto vale", "cuanto es", "cuánto es",
               "precio", "precios", "tarifa", "tarifas", "costo", "costos",
               "cuanto cobran", "cuánto cobran"],
    function: "list_prices" },

  // Ubicación
  { patterns: ["donde queda", "dónde queda", "donde esta", "dónde está",
               "donde se encuentra", "dónde se encuentra", "ubicacion", "ubicación",
               "direccion", "dirección"],
    function: "get_clinic_location" },

  // Horarios
  { patterns: ["horario", "horarios", "a que hora abren", "a qué hora abren",
               "a que hora cierran", "a qué hora cierran", "cuando abren", "cuándo abren"],
    function: "get_clinic_hours" },

  // Contacto
  { patterns: ["telefono", "teléfono", "numero de telefono", "número de teléfono",
               "whatsapp", "email", "correo", "contacto"],
    function: "get_clinic_contact" },

  // Obras sociales
  { patterns: ["obra social", "obras sociales", "aceptan ips", "trabajan con ips",
               "convenio", "convenios", "cobertura", "seguro medico", "seguro médico"],
    function: "get_clinic_insurance" },

  // Doctores
  { patterns: ["que doctores", "qué doctores", "que medicos", "qué médicos",
               "lista de doctores", "lista de medicos", "lista de médicos"],
    function: "list_doctors" },

  // Especialidades
  { patterns: ["que especialidades", "qué especialidades", "especialidades"],
    function: "list_specialties" },

  // Servicios
  { patterns: ["que servicios", "qué servicios", "servicios que ofrecen"],
    function: "list_services" },

  // Info general
  { patterns: ["informacion de la clinica", "información de la clínica",
               "sobre la clinica", "sobre la clínica"],
    function: "get_clinic_info" },
];

function detectOverride(message) {
  const m = message.toLowerCase();
  for (const override of KEYWORD_OVERRIDES) {
    for (const pattern of override.patterns) {
      if (m.includes(pattern)) {
        return override.function;
      }
    }
  }
  return null;
}

// ===================================================================
// PLACEHOLDERS
// ===================================================================
const PLACEHOLDERS = new Set([
  "doctor", "médico", "medico", "paciente", "cliente", "usuario",
  "value", "valor", "dato", "unknown", "desconocido",
  "n/a", "na", "null", "undefined", "none", "ninguno",
  "specialty", "especialidad", "service", "servicio",
  "date", "fecha", "time", "hora", "name", "nombre",
  "location", "ubicacion", "ubicación", "lugar",
  "cost", "costo", "price", "precio",
]);

function isPlaceholder(value) {
  if (typeof value !== "string") return false;
  return PLACEHOLDERS.has(value.trim().toLowerCase());
}

function resolveFunctionName(name) {
  if (!name) return name;
  if (name in CONTRACTS) return name;
  if (name in FUNCTION_ALIASES) return FUNCTION_ALIASES[name];
  return name;
}

// ---------- Utilidades ----------
function now() { return new Date().toISOString(); }

function renderMessages() {
  const el = document.getElementById("messages");
  el.innerHTML = "";
  for (const m of history) {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    if (m.role === "assistant") {
      div.textContent = m.content || m.summary || "";
    } else {
      div.textContent = m.content;
    }
    el.appendChild(div);
  }
  el.scrollTop = el.scrollHeight;
  updateDebug();
}

function updateDebug() {
  document.getElementById("debug-history").textContent   = JSON.stringify(history, null, 2);
  document.getElementById("debug-collected").textContent = JSON.stringify(collectedData, null, 2);
  document.getElementById("debug-appointment").textContent = JSON.stringify(lastAppointment, null, 2);
}

function setState(s) {
  document.getElementById("debug-state").textContent = s;
}

function resetSession() {
  sessionId = crypto.randomUUID();
  history = [];
  collectedData = null;
  lastAppointment = null;
  document.getElementById("debug-analyze").textContent    = "—";
  document.getElementById("debug-synthesize").textContent = "—";
  renderMessages();
  setState("listo");
}

// ---------- Flujo principal ----------
async function sendMessage() {
  const input = document.getElementById("input");
  const btn = document.getElementById("sendBtn");
  const message = input.value.trim();
  if (!message) return;

  input.value = "";
  input.disabled = true;
  btn.disabled = true;

  history.push({ role: "user", content: message, timestamp: now() });
  renderMessages();

  try {
    setState("analizando...");
    const analysis = await postJSON("/v1/analyze", {
      session_id: sessionId,
      message,
      collected_data: collectedData,
      history: history.map(toLLMEntry),
      available_functions: Object.keys(CONTRACTS)
    });
    document.getElementById("debug-analyze").textContent = JSON.stringify(analysis, null, 2);

    // 1. OVERRIDE por palabras clave (máxima prioridad)
    const override = detectOverride(message);
    let resolvedFunction;
    if (override) {
      resolvedFunction = override;
      console.log("[override]", "forzado a:", resolvedFunction, "(Planner dijo:", analysis.function_name, ")");
    } else {
      resolvedFunction = resolveFunctionName(analysis.function_name);
      if (resolvedFunction !== analysis.function_name) {
        console.log("[alias]", analysis.function_name, "→", resolvedFunction);
      }
    }

    const mergedParams = {
      ...(collectedData?.parameters || {}),
      ...(analysis.parameters || {})
    };

    for (const key of Object.keys(mergedParams)) {
      if (isPlaceholder(mergedParams[key])) {
        console.log("[filter] descartado placeholder:", key, "=", mergedParams[key]);
        delete mergedParams[key];
      }
    }

    // Si hay override, forzamos que NO sea conversación
    const isConversation = !override && (
      analysis.intent.startsWith("conversation") || !resolvedFunction
    );

    const contract = CONTRACTS[resolvedFunction] || { required: [] };
    const missing = contract.required.filter(k => !(k in mergedParams));

    if (!isConversation) {
      collectedData = {
        intent: override ? resolvedFunction : analysis.intent,
        function_name: resolvedFunction,
        parameters: mergedParams,
        missing_slots: missing,
        status: missing.length === 0 ? "ready_to_execute" : "waiting_for_data"
      };
    } else {
      collectedData = null;
    }

    let rawData = "";
    let errorCode = "";
    const isKnown = resolvedFunction in CONTRACTS;

    if (!isConversation
        && missing.length === 0
        && resolvedFunction
        && isKnown) {
      setState("ejecutando función...");
      rawData = executeFunction(resolvedFunction, mergedParams);
      if (rawData.startsWith("ERROR:")) {
        errorCode = "execution_failed";
      }
    } else if (!isConversation
               && resolvedFunction
               && !isKnown) {
      setState("función desconocida: " + resolvedFunction);
      rawData = `ERROR: el sistema no tiene registrada la función '${resolvedFunction}'`;
      errorCode = "function_not_found";
    }

    setState("sintetizando...");
    const synth = await postJSON("/v1/synthesize", {
      session_id: sessionId,
      original_message: message,
      intent: override ? resolvedFunction : analysis.intent,
      function_name: resolvedFunction,
      parameters: mergedParams,
      missing_slots: missing,
      raw_data: rawData,
      error_code: errorCode,
      history: history.map(toLLMEntry)
    });
    document.getElementById("debug-synthesize").textContent = JSON.stringify(synth, null, 2);

    history.push({
      role: "assistant",
      content: synth.response,
      summary: synth.history_entry?.summary || "",
      timestamp: synth.history_entry?.timestamp || now()
    });
    if (history.length > 6) history = history.slice(-6);
    renderMessages();

    if (synth.mode === "respond" || synth.mode === "error" || synth.mode === "conversation") {
      collectedData = null;
    }

    setState("listo (" + synth.mode + ")");
  } catch (err) {
    history.push({ role: "system", content: "❌ Error: " + err.message, timestamp: now() });
    renderMessages();
    setState("error: " + err.message);
  } finally {
    input.disabled = false;
    btn.disabled = false;
    input.focus();
  }
}

function toLLMEntry(m) {
  if (m.role === "assistant") {
    return { role: "assistant", summary: m.summary || m.content, timestamp: m.timestamp };
  }
  return { role: m.role, content: m.content, timestamp: m.timestamp };
}

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

// Init
renderMessages();
document.getElementById("input").focus();
</script>
