<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso · GAIA</title>
    <link rel="stylesheet" href="/admin/static/css/admin.css">
</head>
<body>

    <!-- Main actúa como contenedor de layout para centrar -->
    <main class="login-layout">
        
        <!-- Section agrupa el widget de login de forma independiente -->
        <section class="login-box" aria-labelledby="login-heading">
            
            <header class="login-header">
                <h1>GAIA</h1>
                <p>AI Gateway · Administración</p>
            </header>



            <!-- AGREGAR ESTO: Bloque de mensaje de error -->
            {{ if .error }}
            <div class="alert alert-error" role="alert">
                {{ .error }}
            </div>
            {{ end }}
            <!-- FIN DEL BLOQUE -->


            <!-- Formulario con aria-label para contexto -->
            <form action="/admin/login" method="post" aria-label="Formulario de inicio de sesión">
                
                <!-- Fieldset agrupa controles relacionados. Legend es obligatorio para accesibilidad, pero lo ocultamos visualmente -->
                <fieldset>
                    <legend class="sr-only">Credenciales de acceso</legend>
                    
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            autocomplete="username" 
                            required 
                            aria-required="true"
                            placeholder="admin"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            autocomplete="current-password" 
                            required 
                            aria-required="true"
                            placeholder="••••••••"
                        >
                    </div>

                    <button type="submit" class="btn-primary">Ingresar</button>
                </fieldset>

            </form>
        </section>

    </main>

</body>
</html>
