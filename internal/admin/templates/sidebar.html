{{ define "sidebar" }}
<aside class="sidebar">
  <div class="brand">
    <h1>GAIA</h1>
    <p>AI Gateway</p>
  </div>

  <nav>
    <a href="/admin/dashboard" class="{{ if eq .Active "dashboard" }}active{{ end }}">
      Dashboard
    </a>
    <a href="/admin/tenants" class="{{ if eq .Active "tenants" }}active{{ end }}">
      Tenants
    </a>
    <a href="/admin/providers" class="{{ if eq .Active "providers" }}active{{ end }}">
      Providers
    </a>
    <a href="/admin/keys" class="{{ if eq .Active "keys" }}active{{ end }}">
      Keys
    </a>
    <a href="/docs" target="_blank" rel="noopener noreferrer" class="external-link">
      API Docs ↗
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user">{{ .User }}</div>
    <form method="POST" action="/admin/logout">
      <button type="submit" class="btn-logout">Cerrar Sesión</button>
    </form>
  </div>
</aside>
{{ end }}
