{{ define "tenant_created.html" }}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token · GAIA</title>
<link rel="stylesheet" href="/admin/static/css/style.css">
</head>
<body>

<div class="success-layout">
  <div class="success-box card">
    <h1 style="font-size: 28px; font-weight: 900; margin-bottom: 16px;">
      {{ if .rotate }}Token rotado ✓{{ else }}Tenant creado ✓{{ end }}
    </h1>
    
    <p style="font-size: 15px; margin-bottom: 24px;">
      <strong>{{ .tenant.Name }}</strong> — <code class="slug-code">{{ .tenant.Slug }}</code>
    </p>

    <div class="warn-box">
      ⚠ Este token se muestra UNA SOLA VEZ. Copialo y guardalo ahora. Si lo perdés, tendrás que rotarlo.
    </div>

    <div>
      <label style="font-size: 12px; font-weight: 700; text-transform: uppercase;">Token de acceso</label>
      <div class="token-display" id="token">{{ .token }}</div>
    </div>

    <div style="display: flex; gap: 12px;">
      <button class="btn-secondary" onclick="copyToken()" id="copy-btn">Copiar al portapapeles</button>
      <a href="/admin/tenants" class="btn-primary" style="width: auto;">Volver a Tenants</a>
    </div>
  </div>
</div>

<script>
function copyToken() {
  const text = document.getElementById('token').innerText;
  const btn = document.getElementById('copy-btn');
  navigator.clipboard.writeText(text).then(() => {
    const originalText = btn.innerText;
    btn.innerText = '✓ Copiado';
    // Puedes usar clases si prefieres, acá solo cambiamos el texto temporalmente
    setTimeout(() => {
      btn.innerText = originalText;
    }, 2000);
  });
}
</script>

</body>
</html>
{{ end }}
